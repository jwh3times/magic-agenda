# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Minor/patch updates are grouped into a single PR per ecosystem to reduce noise;
# MAJOR bumps arrive individually — EXCEPT for peer-locked families where a lone
# bump would leave an unsatisfiable peer range. Those families travel together as
# one major PR.
version: 2
updates:
  # JavaScript / npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # --- Peer-locked families: a lone major bump leaves an unsatisfiable peer
      #     range, so the family's majors must travel together as one PR. All
      #     minor/patch bumps already batch into the catch-all PR at the bottom,
      #     so these family groups are intentionally major-only. ---

      # react + react-dom ship in lockstep at identical versions and must match at
      # runtime; the @types/* packages track the same major.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"

      # @dnd-kit/sortable peer-requires @dnd-kit/core (^6.3.0), so the family moves
      # together — a core major strands sortable.
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
        update-types:
          - "major"

      # @testing-library/react and user-event both peer-require @testing-library/dom,
      # the shared hub of this family.
      testing-library:
        patterns:
          - "@testing-library/*"
        update-types:
          - "major"

      # Oxlint and oxlint-tsgolint are the syntactic and semantic halves of linting;
      # TypeScript travels with them so compiler and lint-policy majors are tested together.
      lint-and-typescript:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "typescript"
        update-types:
          - "major"

      # @vitejs/plugin-react requires a matching Vite major (plugin-react 6 needs
      # Vite 8); vitest tracks the Vite majors it supports.
      vite-ecosystem:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/plugin-react"
          - "@vitest/*"
        update-types:
          - "major"

      # The E2E toolchain, isolated from the daily catch-all — all update types, not just majors.
      #
      # The `E2E` job CANNOT RUN on a Dependabot PR: GitHub withholds regular repository secrets
      # from the `dependabot` actor, so HAS_SECRETS is "false", the gate step takes its
      # `!= "true"` branch, and the job reports success having scanned nothing. An axe rule change
      # or a bundled-Chromium change therefore merges green and lands red on the NEXT HUMAN PR —
      # the same shape as the Changelog-backfill trap in AGENTS.md.
      #
      # The counts-keyed baseline does not defuse this. Selector-path churn stops mattering, but
      # the old ratchet failed only on INCREASES and tolerated a bump that reduced a count; strict
      # equality does not. A @playwright/test bump changes the bundled Chromium, which moves
      # color-contrast counts in BOTH directions. Grouping makes such a change attributable to one
      # obvious PR; it does not make it survivable.
      #
      # axe-core is transitive under @axe-core/playwright and Dependabot does not open
      # indirect-only npm PRs, so naming the two direct packages captures the family.
      e2e-toolchain:
        patterns:
          - "@axe-core/playwright"
          - "@playwright/test"

      # One PR for all remaining minor + patch bumps; ungrouped majors (e.g.
      # @supabase/supabase-js, react-router, prettier, jsdom) open individually.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
