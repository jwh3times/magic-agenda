# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Minor/patch updates are grouped into a single PR per ecosystem to reduce noise;
# MAJOR bumps arrive individually — EXCEPT for peer-locked families where a lone
# bump would leave an unsatisfiable peer range. Those families travel together as
# one major PR.
version: 2
updates:
  # JavaScript / npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # @playwright/test is pinned out of Dependabot's reach (#280). A Playwright bump changes the
    # bundled Chromium and its font rasterization, which invalidates EVERY visual baseline under
    # tests/e2e/__screenshots__/ — and a bot cannot refresh baselines, so such a PR would sit red on
    # E2E until someone did it by hand. Upgrade it by hand, and refresh the baselines in the same PR
    # (docs/agents/testing.md).
    ignore:
      - dependency-name: "@playwright/test"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # --- Peer-locked families: a lone major bump leaves an unsatisfiable peer
      #     range, so the family's majors must travel together as one PR. All
      #     minor/patch bumps already batch into the catch-all PR at the bottom,
      #     so these family groups are intentionally major-only. ---

      # react + react-dom ship in lockstep at identical versions and must match at
      # runtime; the @types/* packages track the same major.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"

      # @dnd-kit/sortable peer-requires @dnd-kit/core (^6.3.0), so the family moves
      # together — a core major strands sortable.
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
        update-types:
          - "major"

      # @testing-library/react and user-event both peer-require @testing-library/dom,
      # the shared hub of this family.
      testing-library:
        patterns:
          - "@testing-library/*"
        update-types:
          - "major"

      # Oxlint and oxlint-tsgolint are the syntactic and semantic halves of linting;
      # TypeScript travels with them so compiler and lint-policy majors are tested together.
      lint-and-typescript:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "typescript"
        update-types:
          - "major"

      # @vitejs/plugin-react requires a matching Vite major (plugin-react 6 needs
      # Vite 8); vitest tracks the Vite majors it supports.
      vite-ecosystem:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/plugin-react"
          - "@vitest/*"
        update-types:
          - "major"

      # The E2E toolchain, isolated from the daily catch-all — all update types, not just majors.
      #
      # The `E2E` job runs on these PRs. They come from a branch in this repository, and since #368
      # the job uses an isolated local Supabase stack rather than repository secrets, so its gate
      # skips only forks and non-PR events. An axe rule change therefore fails HERE, on the bump
      # that caused it, as axe-core 4.14's label-content-name-mismatch did on #546. Expect such a
      # PR to need a human commit (a fix, or an accepted baseline entry) before it can merge. Its
      # failure traces are not uploaded, because GitHub withholds E2E_TRACE_GPG_PASSPHRASE from
      # the `dependabot` actor; reproduce locally.
      #
      # The baseline asserts strict equality, so a count that FALLS fails too, not only one that
      # rises. Grouping keeps such a change attributable to one obvious PR.
      #
      # axe-core is transitive under @axe-core/playwright and Dependabot does not open
      # indirect-only npm PRs, so naming the two direct packages captures the family.
      #
      # @playwright/test stays in the pattern but is ignored above (#280), so in practice this group
      # now carries @axe-core/playwright alone.
      e2e-toolchain:
        patterns:
          - "@axe-core/playwright"
          - "@playwright/test"

      # One PR for all remaining minor + patch bumps; ungrouped majors (e.g.
      # @supabase/supabase-js, react-router, prettier, jsdom) open individually.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
