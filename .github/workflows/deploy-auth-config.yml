name: Deploy Auth Config

# Applies supabase/config.toml (and the email templates it references) to the
# production project automatically when either changes on `main`.
#
# Requires the repository secrets used by Deploy Migrations plus two more:
#   RESEND_API_KEY               - resolves env(RESEND_API_KEY) in [auth.email.smtp]
#   GOOGLE_OAUTH_CLIENT_SECRET   - resolves env(GOOGLE_OAUTH_CLIENT_SECRET) in [auth.external.google]
#   TURNSTILE_SECRET_KEY         - resolves env(TURNSTILE_SECRET_KEY) in [auth.captcha]
#
# `supabase config push --yes` converges the remote project on the file, so
# re-runs are safe. The PR-side preview of the same push lives in ci.yml (Config job).
#
# Supabase CLI v3 (#640) resolves every value as flag > shell env > project env files >
# config.toml, and `config push` pushes the `SUPABASE_*` variables it sees. Besides `SUPABASE_ENV`
# (below), the three this job sets are credentials and the target (access token, database
# password, project ref). Only the ref also
# names a config.toml key, `project_id`, which is local container naming and not a pushed setting;
# the `Config` preview's `config diff` labels any value an env var supplies, so a new one would show
# there first. `SUPABASE_ENV=production` keeps a `.env.development` file, should one ever be
# committed, from applying; a committed `.env` or `.env.local` would still load, and none is
# tracked (only `.env.example`).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/config.toml'
      - 'supabase/templates/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-auth-config
  cancel-in-progress: false

jobs:
  Deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ENV: production
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Derived from the exact `supabase` devDependency so a CLI bump needs no workflow edit (#338).
      - id: cli
        run: echo "version=$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: ${{ steps.cli.outputs.version }}
      - run: supabase link "$SUPABASE_PROJECT_ID"
      - run: supabase config push --yes
