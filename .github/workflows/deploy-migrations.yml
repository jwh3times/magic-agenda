name: Deploy Migrations

# Applies Supabase migrations to the production database automatically when a migration
# file changes on `main` (i.e. when a PR touching supabase/migrations/** is merged).
#
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - personal access token (Supabase dashboard -> Account -> Access Tokens)
#   SUPABASE_DB_PASSWORD   - the production database password
#   SUPABASE_PROJECT_ID    - the project ref (the <ref> in <ref>.supabase.co)
#
# `supabase db push` is idempotent: it only applies migrations not already recorded in the
# remote migration history, so re-runs and already-applied migrations are no-ops.
#
# Supabase CLI v3 (#640): `db push` with no target pushes to the LOCAL stack, which this runner
# does not have, so `--remote` (the linked project) is load-bearing. Every hosted change also asks
# for consent and fails unattended without `--yes`. `SUPABASE_ENV=production` keeps a
# `.env.development` file, should one ever be committed, from feeding values into the CLI.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

# Least-privilege token: the job only checks out the repo; Supabase auth uses dedicated secrets.
permissions:
  contents: read

# Never let two deploys apply migrations concurrently; queue rather than cancel a push in flight.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  Deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ENV: production
      # config.toml now contains env() references; the CLI parses it during link/push.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Derived from the exact `supabase` devDependency so a CLI bump needs no workflow edit (#338).
      - id: cli
        run: echo "version=$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: ${{ steps.cli.outputs.version }}
      - run: supabase link "$SUPABASE_PROJECT_ID"
      - run: supabase db push --remote --yes
      # The required `RLS` check asserts this same posture against a FRESH LOCAL stack, which is the
      # only database CI can reach — and production carries legacy default privileges a fresh stack
      # does not, so it drifted with every check green (#384). This reads production directly,
      # read-only, through the Management API. It runs after the push so a migration that fixes the
      # posture is already applied.
      # No setup-node: the runner's Node already runs the `node -p` step above, and this script is
      # dependency-free (one fetch, one JSON file).
      - run: node scripts/verify-function-grants.mjs
      # The same argument, for RLS and index posture (#397). `tests/rls/production_posture.test.ts`
      # runs these exact queries against the local stack on every PR, so a failure HERE is drift in
      # production rather than a problem with the branch. Both steps run after the push and are
      # therefore an alarm on a state that already exists, not a gate that prevents it.
      - run: node scripts/verify-schema-posture.mjs
