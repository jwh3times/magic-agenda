name: Backup

# Nightly encrypted logical backup of the production database.
#
# WHY THIS EXISTS: the project is on the Supabase free tier, which has **no automated backups at
# all**. Without this, a dropped table or a bad migration loses every user's data with no restore
# path — the app's export/import is per-user and manual, so it is not a backup.
#
# WHY IT IS ENCRYPTED ON THE RUNNER: this repository is PUBLIC, and GitHub Actions artifacts on
# public repositories can be downloaded by anyone (the "ArtiPACKED" research, Aug 2024; GitHub
# declined to change the behaviour and treats artifact contents as the author's responsibility).
# The dump contains every user's email address, bcrypt password hash, and task content. So the
# bundle is GPG-symmetric-encrypted BEFORE upload and the plaintext never leaves the job. Do not
# add a step that uploads anything from `backup/` directly.
#
# Repository secrets used (the first three already exist for the deploy workflows):
#   SUPABASE_ACCESS_TOKEN   - Supabase personal access token
#   SUPABASE_DB_PASSWORD    - production database password
#   SUPABASE_PROJECT_ID     - project ref
#   BACKUP_GPG_PASSPHRASE   - symmetric passphrase for the bundle. If this is lost, every backup
#                             is permanently unreadable. Keep it in a password manager.
#
# To restore: docs/runbooks/restore-from-backup.md

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily (~05:00 America/New_York)
  workflow_dispatch:

# Least-privilege: the job reads the repo and talks to Supabase with its own secrets.
permissions:
  contents: read

# Never run two backups at once; queue rather than cancel, so a scheduled run is not dropped by a
# manual one.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  Backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # config.toml carries env() references and the CLI parses it on every command, so these must
      # be present even though a backup never touches auth config.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Fail before dumping rather than after: an unset secret is an empty string in Actions, and
      # gpg would happily "encrypt" with an empty passphrase, producing a bundle anyone can open.
      - name: Require the encryption passphrase
        run: |
          if [ -z "$BACKUP_GPG_PASSPHRASE" ]; then
            echo "::error::BACKUP_GPG_PASSPHRASE is not set. Refusing to produce an unencrypted backup."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Two dumps:
      #  - schema: DDL for `public`. Redundant with supabase/migrations/ but makes the bundle
      #    self-contained and captures anything ever applied out-of-band. It excludes the `auth`
      #    schema, which is correct — a Supabase project provisions `auth` itself.
      #  - data: EVERYTHING the CLI will give us, which as of 2026-07-27 includes the `auth` tables
      #    (auth.users, identities, sessions, ...) as well as public.tasks / public.user_settings.
      #
      # There is deliberately NO separate `--schema auth` data dump. One was added originally on the
      # documented premise that `db dump` excludes Supabase-managed schemas — true of the SCHEMA
      # dump, false of the DATA dump. It produced a file that was a strict subset of data.sql, and
      # restoring both in sequence inserted auth.users twice: a duplicate-key failure in the middle
      # of an outage. Verified empirically in run 30227716558.
      #
      # The verify step below asserts data.sql holds BOTH public.tasks and auth.users, so if that
      # CLI behaviour ever changes, this fails loudly instead of silently backing up half a system.
      #
      # pg_dump warns here about a circular foreign key on `tasks` — that is `recur_parent_id`
      # referencing `tasks(id)` (the recurrence template link, init.sql:42), and it is expected.
      # It matters on RESTORE, not on dump; see the runbook.
      - name: Dump schema and data
        run: |
          mkdir -p backup
          supabase db dump --linked -f backup/schema.sql
          supabase db dump --linked --data-only -f backup/data.sql

      # The failure mode that actually bites is a *successful* empty dump: the job stays green for
      # months while backing up nothing. Assert on content, not just exit codes.
      - name: Verify the dumps contain what a restore needs
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # Normalise `COPY "public"."tasks" (...)` and `INSERT INTO public.tasks (...)` down to
          # `public.tasks`. The CLI quotes identifiers, so a literal `grep 'public.tasks'` does NOT
          # match — that over-strict check failed the first real run against a perfectly good dump.
          # The trailing filter keeps only things shaped like an identifier: COPY payload rows are
          # raw user data, and a task titled "INSERT INTO ..." would otherwise print to this log,
          # which is public.
          tables() {
            grep -oE '^(COPY|INSERT INTO) +[^ (]+' "$1" \
              | awk '{ print $NF }' \
              | tr -d '"' \
              | grep -E '^[a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*$' \
              | sort -u
          }
          has_table() { tables "$1" | grep -qx "$2"; }

          # Same normalisation, same reason, for functions — and this one was got wrong once
          # already. The check shipped in v1.2.76 as a literal `grep "FUNCTION public\.$fn"`,
          # verified against raw `pg_dump` output, which writes identifiers unquoted. But this job
          # runs `supabase db dump`, which writes
          # `CREATE OR REPLACE FUNCTION "public"."handle_new_user"()` — so the assertion could never
          # match and would have failed the whole backup job on its first nightly run, producing no
          # backup at all. Caught by dumping a real local database and running the assertion against
          # it, before that run happened.
          #
          # The lesson worth keeping: verify a dump assertion against the command the workflow
          # actually runs, not against a close relative of it.
          functions() {
            grep -oE '^CREATE (OR REPLACE )?FUNCTION +[^(]+' "$1" \
              | awk '{ print $NF }' \
              | tr -d '"' \
              | sort -u
          }
          has_function() { functions "$1" | grep -qx "$2"; }

          for f in schema data; do
            [ -s "backup/$f.sql" ] || fail "backup/$f.sql is empty or missing"
          done

          grep -q 'CREATE TABLE' backup/schema.sql \
            || fail "schema.sql contains no CREATE TABLE — the schema was not captured"

          # Table names only — never row values.
          echo "Tables captured in data.sql:"; tables backup/data.sql | head -30

          # Note the limit of this check: pg_dump emits a COPY statement even for an empty table, so
          # this proves the table was captured, not that it holds rows. Row counts are verified on
          # restore (see the runbook), which is the only place they can be checked meaningfully.
          has_table backup/data.sql public.tasks \
            || fail "data.sql does not contain public.tasks — no board data was captured"
          # This one is load-bearing: it is the only thing standing between us and a backup that
          # restores tasks belonging to users who no longer exist.
          has_table backup/data.sql auth.users \
            || fail "data.sql does not contain auth.users — accounts were not captured. The CLI's --data-only dump used to include the auth schema; if that changed, add an explicit auth dump back."

          # Board containment. Restoring tasks without these is worse than restoring nothing: every
          # task carries a board_id pointing at a board that no longer exists, so the restore either
          # fails on the foreign key or (with session_replication_role = replica, which data.sql
          # sets) succeeds into a database where no task belongs to any board anyone can reach.
          for t in public.boards public.board_memberships public.account_profiles; do
            has_table backup/data.sql "$t" \
              || fail "data.sql does not contain $t — board ownership was not captured, and tasks cannot be restored without it"
          done

          # The authorization layer itself. The schema dump takes no --schema flag, and this job's
          # own comment above describes its output as "DDL for public" — so if the CLI's default
          # ever narrows, or these functions move to another schema, the bundle would restore
          # policies that call functions it did not capture. That produces a database which cannot
          # authorize anything, from a backup that verified clean.
          # `tasks_infer_board_id` was in this list until Board creation shipped and dropped it; a
          # dump asserting a function that no longer exists fails every night. `create_board`
          # replaces it and matters more: it is the only way a Board and its Owner Membership are
          # created together, so a restore without it leaves an account able to read Boards and
          # unable to make one.
          for fn in handle_new_user handle_account_deletion create_board; do
            has_function backup/schema.sql "public.$fn" \
              || fail "schema.sql does not define public.$fn — the authorization/lifecycle layer was not captured"
          done

          # The policies are the authorization boundary itself. A schema dump that restored tables
          # and functions but no policies would produce a database that is default-deny on every
          # table — which fails closed, but silently and identically to "everyone lost their data".
          policy_count=$(grep -c '^CREATE POLICY' backup/schema.sql || true)
          [ "${policy_count:-0}" -ge 12 ] \
            || fail "schema.sql defines only ${policy_count:-0} policies — expected at least 12; the authorization boundary was not captured"

          echo "Dump sizes (bytes):"
          wc -c backup/*.sql

      - name: Bundle, encrypt, and prove it decrypts
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          bundle="supabase-backup-$stamp.tar.gz"

          tar -czf "$bundle" -C backup .
          printf '%s' "$BACKUP_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$bundle.gpg" "$bundle"

          # Paranoia, cheaply: if encryption silently no-opped, table names would still be readable.
          if grep -qa 'auth.users' "$bundle.gpg"; then
            echo "::error::Plaintext found in the encrypted bundle — refusing to upload."
            exit 1
          fi

          # A backup that cannot be opened is not a backup. Round-trip it here, while the failure
          # is cheap, rather than discovering it during an outage.
          printf '%s' "$BACKUP_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt -o roundtrip.tar.gz "$bundle.gpg"
          entries="$(tar -tzf roundtrip.tar.gz | grep -c '\.sql$')"
          if [ "$entries" -ne 2 ]; then
            echo "::error::Round-trip check expected 2 .sql files, found $entries."
            exit 1
          fi

          # Leave only the encrypted bundle on disk for the upload step.
          rm -rf backup roundtrip.tar.gz "$bundle"
          echo "stamp=$stamp" >> "$GITHUB_ENV"
          echo "Encrypted bundle: $bundle.gpg ($(wc -c < "$bundle.gpg") bytes)"

      - uses: actions/upload-artifact@v7
        with:
          name: supabase-backup-${{ env.stamp }}
          path: supabase-backup-${{ env.stamp }}.tar.gz.gpg
          # 90 days is the ceiling for a public repo. Anything older is gone — if you need a
          # longer horizon, that is the point at which off-GitHub storage becomes necessary.
          retention-days: 90
          if-no-files-found: error
