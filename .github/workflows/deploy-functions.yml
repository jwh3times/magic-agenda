name: Deploy Functions

# Deploys Supabase Edge Functions to production automatically when a function
# changes on `main` (i.e. when a PR touching supabase/functions/** is merged).
#
# Requires these repository secrets (already set for Deploy Migrations):
#   SUPABASE_ACCESS_TOKEN  - personal access token
#   SUPABASE_PROJECT_ID    - the project ref (the <ref> in <ref>.supabase.co)
#
# `supabase functions deploy` with no name deploys every function in
# supabase/functions/, so re-runs are safe.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  Deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # config.toml now contains env() references; the CLI parses config.toml (with its env() references) on every command, including functions deploy.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Derived from the exact `supabase` devDependency so a CLI bump needs no workflow edit (#338).
      - id: cli
        run: echo "version=$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: ${{ steps.cli.outputs.version }}
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
