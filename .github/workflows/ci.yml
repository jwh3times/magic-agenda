name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: every job only reads the repo to build and test.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Build only needs these to exist; real values are set in Cloudflare Pages.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  Functions:
    runs-on: ubuntu-latest
    # Run inside the functions dir: Deno only discovers deno.json (nodeModulesDir)
    # and deno.lock from the working directory upward, never from the path argument.
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test

  # .claude/ is the source of truth for both harnesses; .codex/agents and
  # .agents/skills are generated from it and committed. This fails a PR that edits
  # one without regenerating the other. No `npm ci` — the script has no deps.
  Agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run codex:check

  # Every merge to main auto-releases (see version.yml), so each PR must document
  # the version its merge will mint, and every already-released build must have an
  # entry. Only skipped on push-to-main, where "the next version" isn't documented
  # yet by definition.
  Changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full tags, needed to compute the next build number
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify CHANGELOG covers this merge and every released build
        # The Dependabot exemption lives in the step, not the job's `if:`, so the
        # job always reports a status — this is a required check, and one that
        # never runs leaves a PR unmergeable forever. Keyed off the PR author
        # rather than github.actor, which becomes a human's name when someone
        # re-runs a Dependabot PR's workflow and would drop the exemption.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR: exempt (a bot can't write a changelog entry)."
            echo "The version this merge mints gets backfilled by the next human PR,"
            echo "which this same check enforces."
            exit 0
          fi
          node scripts/check-changelog.mjs

  # Previews what `supabase config push` would change, WITHOUT applying it: the CLI
  # has no --dry-run, but run non-interactively without --yes it prints its diff and
  # aborts at the confirmation prompt. The real push happens in deploy-auth-config.yml
  # on merge. This job always reports a status (a required check that skips wedges the
  # PR — see AGENTS.md), exiting early when the PR doesn't touch config paths.
  # NOTE: the success/abort output patterns below were written before the first real
  # run; PR 1 of the config-as-code plan is the calibration run — adjust there if the
  # CLI's wording differs.
  Config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip when the PR touches no config paths
        id: paths
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- supabase/config.toml 'supabase/templates/**' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No auth-config changes in this PR." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v3
        if: steps.paths.outputs.changed == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.paths.outputs.changed == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview config push (never applies)
        if: steps.paths.outputs.changed == 'true'
        run: |
          set +e
          out=$(supabase config push </dev/null 2>&1)
          code=$?
          set -e
          {
            echo '## Pending `supabase config push` diff'
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "Push exited 0 without confirmation — remote already matches the file (no-op)."
            exit 0
          fi
          if echo "$out" | grep -qiE 'confirm|do you want|cancel|abort|EOF'; then
            echo "Preview complete: push aborted at the confirmation prompt as intended."
            exit 0
          fi
          echo "config push failed for a reason other than the confirmation prompt."
          exit "$code"
