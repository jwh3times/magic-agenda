name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: every job only reads the repo to build and test.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Build only needs these to exist; real values are set in Cloudflare Pages.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  Functions:
    runs-on: ubuntu-latest
    # Run inside the functions dir: Deno only discovers deno.json (nodeModulesDir)
    # and deno.lock from the working directory upward, never from the path argument.
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test

  # Two generated trees, opposite directions: .codex/agents is generated from
  # .claude/agents/, and .claude/skills is generated from .agents/skills/ (see AGENTS.md).
  # This fails a PR that edits an authored tree without regenerating the other side.
  # No `npm ci` — the script has no deps.
  Agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run codex:check

  # Every merge to main auto-releases (see version.yml), so each PR must document
  # the version its merge will mint, and every already-released build must have an
  # entry. Only skipped on push-to-main, where "the next version" isn't documented
  # yet by definition.
  Changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full tags, needed to compute the next build number
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify CHANGELOG covers this merge and every released build
        # The Dependabot exemption lives in the step, not the job's `if:`, so the
        # job always reports a status — this is a required check, and one that
        # never runs leaves a PR unmergeable forever. Keyed off the PR author
        # rather than github.actor, which becomes a human's name when someone
        # re-runs a Dependabot PR's workflow and would drop the exemption.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR: exempt (a bot can't write a changelog entry)."
            echo "The version this merge mints gets backfilled by the next human PR,"
            echo "which this same check enforces."
            exit 0
          fi
          node scripts/check-changelog.mjs

  # Previews what `supabase config push` would change, WITHOUT applying it. The CLI
  # has no --dry-run, and running it non-interactively with closed stdin is NOT safe:
  # its confirmation prompts default to YES on EOF (verified against the CLI source
  # and its integration tests). `yes n |` streams a decline to every prompt, so this
  # job can never apply config. The prompt lines in the output ARE the preview: no
  # prompts + exit 0 = remote already matches the file; each "Do you want to push…?"
  # line names a service with pending changes. The real push happens in
  # deploy-auth-config.yml on merge (--yes). This job always reports a status (a
  # required check that skips wedges the PR — see AGENTS.md), exiting early when the
  # PR doesn't touch config paths, and for Dependabot PRs (which get no secrets).
  # NOTE: output patterns below were written before the first real run; PR 1 of the
  # config-as-code plan is the calibration run — adjust there if wording differs.
  Config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip when the PR touches no config paths (or author is Dependabot)
        id: paths
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR: no secrets available; preview skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- supabase/config.toml 'supabase/templates/**')
          if [ -n "$changed_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No auth-config changes in this PR." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v3
        if: steps.paths.outputs.changed == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.paths.outputs.changed == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview config push (declines every prompt — never applies)
        if: steps.paths.outputs.changed == 'true'
        run: |
          # Never add shell: bash to this job: that turns on pipefail, and yes(1) dying of SIGPIPE would misreport config push's exit code (141) and corrupt the no-op classification.
          set +e
          out=$(yes n | supabase config push 2>&1)
          code=$?
          set -e
          {
            echo '## Pending `supabase config push` changes (each declined prompt = one pending service)'
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$out"
          prompts=$(echo "$out" | grep -ciE 'do you want|\[y/n\]' || true)
          if [ "$code" -eq 0 ] && [ "$prompts" -eq 0 ]; then
            echo "No pending changes — remote already matches the file."
            exit 0
          fi
          if [ "$prompts" -gt 0 ]; then
            echo "Preview complete: $prompts pending change prompt(s), all declined — nothing applied."
            exit 0
          fi
          echo "config push failed before reaching any confirmation prompt."
          exit "$code"

  RLS:
    runs-on: ubuntu-latest
    # A wedged image pull would otherwise hold a runner for the 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # This installs the pinned CLI too. Deliberately NO `supabase/setup-cli` step here, unlike
      # the Config job: every Supabase call in this job and in tests/rls/globalSetup.ts goes
      # through `npx supabase`, and `npx` prefers a local binary but silently installs `latest`
      # from the registry when there is none -- so a setup-cli pin would be ignored and the
      # version would float. `supabase` is an exact-pinned devDependency instead, which pins CI
      # and local runs with one mechanism. If you add setup-cli back, change these to bare
      # `supabase` or the pin does nothing.
      - run: npm ci
      - name: Start a local stack
        # Only the database, auth, and PostgREST are needed; skipping the rest cuts minutes off
        # a cold runner. Every value below is a DUMMY: config.toml references these via env().
        # RESEND_API_KEY and GOOGLE_OAUTH_CLIENT_SECRET are the load-bearing two -- never pass
        # the real RESEND_API_KEY, since config.toml enables SMTP against smtp.resend.com and a
        # local GoTrue holding the real key could send real email from a test run. The rest are
        # cheap insurance: the Config job passes today with only those two set, so the CLI does
        # tolerate unresolved env() at parse time, but this job actually STARTS storage
        # (config.toml:147-149) rather than only parsing the file.
        run: npx supabase start -x studio,edge-runtime,logflare,vector,imgproxy
        env:
          RESEND_API_KEY: dummy-not-a-real-key
          GOOGLE_OAUTH_CLIENT_SECRET: dummy-not-a-real-secret
          OPENAI_API_KEY: dummy-not-a-real-key
          S3_HOST: dummy.local
          S3_REGION: local
          S3_ACCESS_KEY: dummy-access-key
          S3_SECRET_KEY: dummy-secret-key
      - name: Run the RLS suite
        run: npm run test:rls

  E2E:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow default, so contents: read is restated here.
    permissions:
      contents: read
      # scripts/preview-url.mjs reads the Cloudflare Pages check run to find the preview URL.
      checks: read
    # One shared production test account, so runs must not overlap across PRs.
    # cancel-in-progress: false because a half-run suite leaves the account mid-seed.
    #
    # The group is scoped to pull_request events. This workflow also runs on push to main, where the
    # job gate-skips in seconds -- but it would still JOIN the group, and GitHub keeps only one
    # pending run per group. A merge landing while one PR's suite runs and another waits would evict
    # the waiting PR's job, so every busy merge would wedge a queued PR once this check is required.
    # Off-PR runs therefore get a per-run group of their own, which contends with nothing.
    #
    # ACCEPTED COST, unchanged: with three or more PRs queued, the middle one is still cancelled and
    # needs a manual re-run.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'e2e-prod-account' || format('e2e-noop-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      # All three skips report SUCCESS from inside a step, never a job-level `if:`. A required check
      # that never runs leaves a PR unmergeable forever -- the same rule the Changelog job follows.
      #
      # The gate runs FIRST, before checkout and npm ci: it needs neither, and every push to main
      # plus every Dependabot PR would otherwise pay a full install to decide to do nothing.
      - name: Decide whether to run
        id: gate
        env:
          HAS_SECRETS: ${{ secrets.E2E_TEST_EMAIL != '' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull_request event ($EVENT): there is no preview to test. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "Fork PR: Cloudflare builds no preview and secrets are unavailable. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_SECRETS" != "true" ]; then
            echo "No E2E secrets available (Dependabot or unconfigured repo). Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Resolve the preview URL
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          URL="$(node scripts/preview-url.mjs "${{ github.event.pull_request.head.sha }}")"
          echo "Preview: $URL"
          echo "E2E_BASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Run the E2E suite
        if: steps.gate.outputs.run == 'true'
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: npm run test:e2e

      # Playwright traces are ENCRYPTED before upload, for the same reason backup.yml encrypts its
      # dump: this repository is public, and GitHub artifacts on public repos are downloadable by
      # anyone. A trace is not innocuous -- it stores the Supabase request headers verbatim,
      # including `authorization: Bearer <JWT>` in full (measured: 814 chars) for the E2E account.
      # The token expires after jwt_expiry (3600s) while the artifact lives for days, so the window
      # is small and RLS still bounds it to that one throwaway account -- but a live credential in a
      # world-readable artifact is not something to ship knowingly. Never replace this with a plain
      # upload of test-results/.
      - name: Encrypt the traces
        id: traces
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          E2E_TRACE_GPG_PASSPHRASE: ${{ secrets.E2E_TRACE_GPG_PASSPHRASE }}
        run: |
          if [ ! -d test-results ] || [ -z "$(ls -A test-results 2>/dev/null)" ]; then
            echo "No traces were produced; nothing to upload."
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Deliberately a SKIP, not a failure. gpg would happily "encrypt" with an empty passphrase,
          # producing a bundle anyone can open, and failing here would turn a test failure into a
          # confusing infrastructure failure on a required check. Losing a debug artifact is the
          # right trade against leaking one.
          if [ -z "$E2E_TRACE_GPG_PASSPHRASE" ]; then
            echo "::notice::E2E_TRACE_GPG_PASSPHRASE is not set, so traces cannot be encrypted and will NOT be uploaded. Add that repository secret to get failure traces back."
            rm -rf test-results
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bundle="e2e-traces-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz"
          tar -czf "$bundle" -C test-results .
          printf '%s' "$E2E_TRACE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$bundle.gpg" "$bundle"

          # Paranoia, cheaply: if gpg silently no-opped, the output would still be a readable tarball.
          if tar -tzf "$bundle.gpg" >/dev/null 2>&1; then
            echo "::error::The encrypted bundle is still a readable tarball — refusing to upload."
            exit 1
          fi

          # An artifact that cannot be opened is useless. Round-trip it here, where failing is cheap.
          printf '%s' "$E2E_TRACE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt -o roundtrip.tar.gz "$bundle.gpg"
          if ! tar -tzf roundtrip.tar.gz >/dev/null 2>&1; then
            echo "::error::Round-trip decryption did not yield a readable tarball."
            exit 1
          fi

          # Leave ONLY the ciphertext on disk.
          rm -rf test-results roundtrip.tar.gz "$bundle"
          echo "bundle=$bundle.gpg" >> "$GITHUB_OUTPUT"
          echo "encrypted=true" >> "$GITHUB_OUTPUT"
          echo "Encrypted traces: $bundle.gpg ($(wc -c < "$bundle.gpg") bytes)"
          echo "Decrypt with: gpg --decrypt --output traces.tar.gz $bundle.gpg"
          echo "After inspection, delete traces.tar.gz and every extracted trace file; keep only $bundle.gpg."

      - name: Upload the encrypted traces
        if: failure() && steps.traces.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.traces.outputs.bundle }}
          retention-days: 7
          if-no-files-found: error
