name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: every job only reads the repo to build and test.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Build only needs these to exist; real values are set in Cloudflare Pages.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  Functions:
    runs-on: ubuntu-latest
    # Run inside the functions dir: Deno only discovers deno.json (nodeModulesDir)
    # and deno.lock from the working directory upward, never from the path argument.
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test

  # .claude/ is the source of truth for both harnesses; .codex/agents and
  # .agents/skills are generated from it and committed. This fails a PR that edits
  # one without regenerating the other. No `npm ci` — the script has no deps.
  Agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run codex:check

  # Every merge to main auto-releases (see version.yml), so each PR must document
  # the version its merge will mint, and every already-released build must have an
  # entry. Only skipped on push-to-main, where "the next version" isn't documented
  # yet by definition.
  Changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full tags, needed to compute the next build number
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify CHANGELOG covers this merge and every released build
        # The Dependabot exemption lives in the step, not the job's `if:`, so the
        # job always reports a status — this is a required check, and one that
        # never runs leaves a PR unmergeable forever. Keyed off the PR author
        # rather than github.actor, which becomes a human's name when someone
        # re-runs a Dependabot PR's workflow and would drop the exemption.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR: exempt (a bot can't write a changelog entry)."
            echo "The version this merge mints gets backfilled by the next human PR,"
            echo "which this same check enforces."
            exit 0
          fi
          node scripts/check-changelog.mjs

  # Previews what `supabase config push` would change, WITHOUT applying it. The CLI
  # has no --dry-run, and running it non-interactively with closed stdin is NOT safe:
  # its confirmation prompts default to YES on EOF (verified against the CLI source
  # and its integration tests). `yes n |` streams a decline to every prompt, so this
  # job can never apply config. The prompt lines in the output ARE the preview: no
  # prompts + exit 0 = remote already matches the file; each "Do you want to push…?"
  # line names a service with pending changes. The real push happens in
  # deploy-auth-config.yml on merge (--yes). This job always reports a status (a
  # required check that skips wedges the PR — see AGENTS.md), exiting early when the
  # PR doesn't touch config paths, and for Dependabot PRs (which get no secrets).
  # NOTE: output patterns below were written before the first real run; PR 1 of the
  # config-as-code plan is the calibration run — adjust there if wording differs.
  Config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip when the PR touches no config paths (or author is Dependabot)
        id: paths
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR: no secrets available; preview skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- supabase/config.toml 'supabase/templates/**')
          if [ -n "$changed_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No auth-config changes in this PR." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v3
        if: steps.paths.outputs.changed == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.paths.outputs.changed == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview config push (declines every prompt — never applies)
        if: steps.paths.outputs.changed == 'true'
        run: |
          # Never add shell: bash to this job: that turns on pipefail, and yes(1) dying of SIGPIPE would misreport config push's exit code (141) and corrupt the no-op classification.
          set +e
          out=$(yes n | supabase config push 2>&1)
          code=$?
          set -e
          {
            echo '## Pending `supabase config push` changes (each declined prompt = one pending service)'
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$out"
          prompts=$(echo "$out" | grep -ciE 'do you want|\[y/n\]' || true)
          if [ "$code" -eq 0 ] && [ "$prompts" -eq 0 ]; then
            echo "No pending changes — remote already matches the file."
            exit 0
          fi
          if [ "$prompts" -gt 0 ]; then
            echo "Preview complete: $prompts pending change prompt(s), all declined — nothing applied."
            exit 0
          fi
          echo "config push failed before reaching any confirmation prompt."
          exit "$code"
